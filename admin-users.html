<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Sumber - Pengurusan Pengguna & Peranan</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Navigasi -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="p-2 text-slate-500 hover:text-slate-800 rounded-lg hover:bg-slate-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">Pengurusan Pengguna & Peranan Admin</h1>
          <p class="text-xs text-slate-500">Lantik atau batalkan peranan Admin pembantu</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Kandungan Utama -->
  <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-1">
    
    <!-- Carian Pengguna -->
    <div class="mb-6">
      <input type="text" id="searchUserInput" oninput="filterUsers()" placeholder="Cari nama peminjam, No. IC, atau jawatan..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-sm shadow-sm">
    </div>

    <!-- Status Loading -->
    <div id="loadingIndicator" class="text-center py-12 text-slate-400">
      <svg class="animate-spin h-7 w-7 text-blue-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
      <span class="text-sm">Memuatkan senarai pengguna...</span>
    </div>

    <!-- Senarai Pengguna -->
    <div id="usersList" class="space-y-3 hidden"></div>

    <!-- Paparan Kosong -->
    <div id="emptyUsers" class="hidden text-center py-16 text-slate-500 text-sm">
      Tiada rekod pengguna dijumpai.
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://anjcoojuerbekgassrrf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuamNvb2p1ZXJiZWtnYXNzcnJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Mjg2NTEsImV4cCI6MjEwNjAwNDY1MX0.L_X-J-dtUW9z2F0DPoWgwh5h57C0H9jFYuloIYY8BuQ";

    let supabaseClient = null;
    let allUsers = [];

    function getSupabase() {
      if (!supabaseClient) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return supabaseClient;
    }

    // Kawalan Akses: Hanya admin boleh buka
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    if (!currentUser || currentUser.role !== 'admin') {
      alert("Akses Terhad: Hanya Pentadbir boleh mengakses halaman ini.");
      window.location.href = "login.html";
    }

    async function loadUsers() {
      const client = getSupabase();
      const loadingEl = document.getElementById('loadingIndicator');

      try {
        const { data, error } = await client
          .from('users')
          .select('*')
          .order('id', { ascending: true });

        if (error) throw error;
        allUsers = data || [];
        loadingEl.classList.add('hidden');
        renderUsers(allUsers);
      } catch (err) {
        alert("Ralat memuatkan senarai pengguna: " + err.message);
        loadingEl.classList.add('hidden');
      }
    }

    function renderUsers(users) {
      const listEl = document.getElementById('usersList');
      const emptyEl = document.getElementById('emptyUsers');
      listEl.innerHTML = '';

      if (users.length === 0) {
        listEl.classList.add('hidden');
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      listEl.classList.remove('hidden');

      users.forEach(user => {
        const isSelf = user.id === currentUser.id;
        const isAdmin = user.role === 'admin';

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3";

        card.innerHTML = `
          <div>
            <div class="flex items-center space-x-2">
              <h3 class="font-bold text-slate-900 text-sm">${user.full_name}</h3>
              ${isSelf ? '<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold">Akaun Anda</span>' : ''}
              ${isAdmin 
                ? '<span class="text-[10px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded-full">ADMIN</span>' 
                : '<span class="text-[10px] bg-slate-100 text-slate-600 font-medium px-2 py-0.5 rounded-full">USER BIASA</span>'}
            </div>
            <p class="text-xs text-slate-500 mt-1">
              <strong>Jawatan:</strong> ${user.position || '-'} | <strong>No. IC:</strong> ${user.ic_number} | <strong>Tel:</strong> ${user.phone_number}
            </p>
          </div>

          <div class="flex items-center space-x-2">
            ${isSelf ? '<span class="text-xs text-slate-400 italic">Admin Utama</span>' : `
              <button onclick="toggleUserRole(${user.id}, '${isAdmin ? 'user' : 'admin'}', '${user.full_name}')" 
                class="px-3.5 py-2 text-xs font-bold rounded-lg transition shadow-sm ${
                  isAdmin 
                    ? 'bg-amber-100 hover:bg-amber-200 text-amber-800' 
                    : 'bg-blue-600 hover:bg-blue-700 text-white'
                }">
                ${isAdmin ? 'Tukar ke User Biasa' : 'Lantik Sebagai Admin'}
              </button>
            `}
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    async function toggleUserRole(userId, newRole, userName) {
      const actionText = newRole === 'admin' ? `melantik "${userName}" sebagai ADMIN?` : `menurunkan kuasa "${userName}" kepada USER BIASA?`;
      if (!confirm(`Adakah anda pasti ingin ${actionText}`)) return;

      try {
        const client = getSupabase();
        const { error } = await client
          .from('users')
          .update({ role: newRole })
          .eq('id', userId);

        if (error) throw error;

        alert(`Peranan berjaya dikemaskini kepada: ${newRole.toUpperCase()}!`);
        loadUsers();
      } catch (err) {
        alert("Ralat mengemaskini peranan: " + err.message);
      }
    }

    function filterUsers() {
      const q = document.getElementById('searchUserInput').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.full_name && u.full_name.toLowerCase().includes(q)) ||
        (u.ic_number && u.ic_number.toLowerCase().includes(q)) ||
        (u.position && u.position.toLowerCase().includes(q))
      );
      renderUsers(filtered);
    }

    window.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
