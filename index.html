<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Sumber - Katalog Buku</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Navigasi -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <!-- Logo CKM -->
        <img src="logo.png" alt="Logo CKM" class="w-10 h-10 rounded-xl shadow-sm object-cover border border-slate-200">
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">Pusat Sumber CKM</h1>
          <p class="text-xs text-slate-500" id="userGreeting">Memuatkan sesi pengguna...</p>
        </div>
      </div>

      <!-- Butang Tindakan Mengikut Peranan -->
      <div class="flex items-center space-x-2">
        <!-- Butang untuk Admin Sahaja -->
        <a id="adminLoansBtn" href="admin-loans.html" class="hidden items-center space-x-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold px-3 py-2 rounded-xl transition shadow">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
          <span>Kelulusan Pinjaman</span>
        </a>
        <!-- Butang Urus Pengguna (Admin Sahaja) -->
        <a id="adminUsersBtn" href="admin-users.html" class="hidden items-center space-x-1.5 bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-2 rounded-xl transition shadow">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <span>Urus Peranan</span>
        </a>

        <a id="adminRegisterBtn" href="register.html" class="hidden items-center space-x-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-xl transition shadow">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Daftar Buku</span>
        </a>

        <!-- Butang untuk User Melihat Rekod Pinjaman Sendiri -->
        <button id="myLoansBtn" onclick="toggleMyLoansView()" class="hidden items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          <span id="myLoansBtnText">Buku Pinjaman Saya</span>
        </button>

        <!-- Butang Log Keluar -->
        <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-600 rounded-xl hover:bg-red-50 transition" title="Log Keluar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Kawasan Carian & Tapis -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <div id="filterControls" class="flex flex-col sm:flex-row gap-3 mb-6">
      <div class="relative flex-1">
        <input type="text" id="searchInput" placeholder="Cari kod buku (cth: GP-001), tajuk, pengarang..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-sm">
        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <select id="filterType" class="px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="all">Semua Format</option>
        <option value="physical">Buku Fizikal</option>
        <option value="ebook">E-Book (Digital)</option>
      </select>
      <!-- Dropdown Filter Kategori Tambahan -->
      <select id="filterCategory" onchange="applyFilters()" class="px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="all">Semua Kategori</option>
        <option value="Akta, Dasar & Polisi">Akta, Dasar & Polisi</option>
        <option value="Buletin">Buletin</option>
        <option value="Coffee Book Table">Coffee Book Table</option>
        <option value="Garis Panduan">Garis Panduan</option>
        <option value="Jurnal">Jurnal</option>
        <option value="Laporan Tahunan">Laporan Tahunan</option>
        <option value="Manual">Manual</option>
        <option value="Nota Rujukan">Nota Rujukan</option>
        <option value="Pentadbiran">Pentadbiran</option>
        <option value="Spesifikasi">Spesifikasi</option>
        <option value="Standard">Standard</option>
        <option value="Laporan Teknikal">Laporan Teknikal</option>
        <option value="Umum">Umum</option>
      </select>
    </div>

    <!-- Tajuk Seksyen Pinjaman Saya (Jika aktif) -->
    <div id="myLoansSectionTitle" class="hidden mb-4 flex items-center justify-between">
      <h2 class="text-base font-bold text-slate-900">Senarai Buku Yang Sedang Anda Pinjam</h2>
      <button onclick="toggleMyLoansView()" class="text-xs text-blue-600 hover:underline">Kembali ke Katalog Utama</button>
    </div>

    <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20 text-slate-400">
      <svg class="animate-spin h-8 w-8 text-blue-600 mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
      <span class="text-sm">Memuatkan senarai buku...</span>
    </div>

    <!-- Penunjuk Jumlah Buku -->
    <div class="mb-3 flex justify-between items-center text-xs text-slate-500 font-medium px-1">
      <span id="totalBooksCount">Memuatkan bilangan...</span>
    </div>

    <!-- Grid Katalog Buku -->
    <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden"></div>

    <div id="emptyState" class="hidden text-center py-16">
      <p class="text-slate-500 text-sm">Tiada buku ditemui dalam rekod.</p>
    </div>
  </main>

  <!-- Modal Pratonton / Edit / Padam Buku -->
  <div id="bookModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-white w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]">
      
      <div class="md:w-1/2 bg-slate-900 flex items-center justify-center p-4 relative">
        <img id="modalImg" src="" alt="Kulit Buku" class="max-h-72 md:max-h-96 w-auto object-contain rounded-lg shadow-lg">
      </div>

      <div class="md:w-1/2 p-6 flex flex-col justify-between overflow-y-auto">
        <div id="viewMode">
          <div class="flex justify-between items-start mb-2">
            <div class="flex items-center space-x-2">
              <span id="modalCodeBadge" class="text-xs px-2.5 py-1 rounded-full font-mono font-bold bg-blue-100 text-blue-800"></span>
              <span id="modalBadge" class="text-xs px-2.5 py-1 rounded-full font-medium"></span>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>
          <h2 id="modalTitle" class="text-xl font-bold text-slate-900 leading-snug"></h2>
          <p id="modalAuthor" class="text-sm text-slate-600 mt-1"></p>
          <div class="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-500 space-y-1.5">
            <p><strong>Kategori:</strong> <span id="modalCategory" class="text-slate-700"></span></p>
            <p><strong>Status:</strong> <span id="modalStatus" class="font-semibold"></span></p>
          </div>

          <div class="mt-6 space-y-2">
            <a id="modalDriveBtn" href="#" target="_blank" rel="noopener noreferrer" class="w-full hidden items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2.5 rounded-xl transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
              <span>Buka / Baca E-Book di Drive</span>
            </a>

            <!-- Butang Pinjam (Hantar Permohonan) -->
            <button id="modalBorrowBtn" onclick="handleRequestBorrow()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-xl transition">
              Mohon Pinjam Buku Ini
            </button>
          </div>

          <!-- Butang Edit & Padam (KHAS ADMIN SAHAJA) -->
          <div id="adminActionSection" class="hidden mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
            <button onclick="enterEditMode()" class="inline-flex items-center space-x-1 text-xs font-semibold text-slate-700 hover:text-blue-600 bg-slate-100 hover:bg-blue-50 px-3 py-2 rounded-lg transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              <span>Edit Buku</span>
            </button>
            <button onclick="handleDeleteBook()" class="inline-flex items-center space-x-1 text-xs font-semibold text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              <span>Padam</span>
            </button>
          </div>
        </div>

        <!-- Mode Edit Form (Admin Sahaja) -->
        <div id="editMode" class="hidden">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-900 text-sm">Kemaskini Butiran Buku</h3>
            <button onclick="exitEditMode()" class="text-xs text-slate-500 hover:text-slate-800">Batal</button>
          </div>
          <form id="editForm" onsubmit="handleSaveEdit(event)" class="space-y-3 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Kod Buku</label>
              <input type="text" id="editBookCode" required class="w-full px-3 py-2 rounded-lg border border-slate-300 font-mono font-bold">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Tajuk Buku</label>
              <input type="text" id="editBookTitle" required class="w-full px-3 py-2 rounded-lg border border-slate-300">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Pengarang</label>
              <input type="text" id="editBookAuthor" class="w-full px-3 py-2 rounded-lg border border-slate-300">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Pautan E-Book (Drive)</label>
              <input type="url" id="editDriveUrl" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-300">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Tukar Gambar Kulit (Pilihan)</label>
              <input type="file" id="editNewCover" accept="image/*" class="w-full text-slate-500 text-xs">
            </div>
            <div class="pt-2 flex space-x-2">
              <button type="submit" id="saveEditBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg">Simpan Perubahan</button>
              <button type="button" onclick="exitEditMode()" class="px-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 rounded-lg">Batal</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://anjcoojuerbekgassrrf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuamNvb2p1ZXJiZWtnYXNzcnJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Mjg2NTEsImV4cCI6MjEwNjAwNDY1MX0.L_X-J-dtUW9z2F0DPoWgwh5h57C0H9jFYuloIYY8BuQ";

    let supabaseClient = null;
    let allBooks = [];
    let selectedBook = null;
    let isShowingMyLoans = false;

    // Semak Log Masuk Pengguna
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    if (!currentUser) {
      window.location.href = "login.html";
    }

    function getSupabase() {
      if (!supabaseClient) {
        if (!window.supabase) throw new Error("Library Supabase belum sedia.");
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return supabaseClient;
    }

    function setupRoleUI() {
      const greeting = document.getElementById('userGreeting');
      greeting.innerText = `${currentUser.full_name} (${currentUser.role === 'admin' ? 'Admin' : currentUser.position})`;

      if (currentUser.role === 'admin') {
        document.getElementById('adminLoansBtn').classList.remove('hidden');
        document.getElementById('adminLoansBtn').classList.add('inline-flex');
        document.getElementById('adminRegisterBtn').classList.remove('hidden');
        document.getElementById('adminRegisterBtn').classList.add('inline-flex');
      } else {
        document.getElementById('myLoansBtn').classList.remove('hidden');
        document.getElementById('myLoansBtn').classList.add('inline-flex');
      }
      const usersBtn = document.getElementById('adminUsersBtn');
        if (usersBtn) {
          usersBtn.classList.remove('hidden');
          usersBtn.classList.add('inline-flex');
        }
      }
    

    function handleLogout() {
      if (confirm("Adakah anda ingin log keluar?")) {
        localStorage.removeItem('currentUser');
        window.location.href = "login.html";
      }
    }

    async function fetchBooks() {
      const client = getSupabase();
      // Tambahkan .range(0, 4999) supaya menarik sehingga 5,000 rekod buku
      const { data, error } = await client
        .from("books")
        .select("*")
        .order("created_at", { ascending: false })
        .range(0, 4999);

      if (error) throw error;
      return data || [];
    }

    async function loadCatalog() {
      const loadingEl = document.getElementById('loadingIndicator');
      try {
        allBooks = await fetchBooks();
        loadingEl.classList.add('hidden');
        renderBooks(allBooks);
      } catch (err) {
        loadingEl.classList.add('hidden');
        alert("Gagal memuatkan rekod buku: " + (err.message || err));
      }
    }

  function renderBooks(books) {
      const grid = document.getElementById('booksGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      // 1. Paparkan jumlah buku di Console pelayar untuk semakan (F12 di PC)
      console.log("Jumlah buku berjaya ditarik:", books.length);

      // 2. Kemas kini teks penunjuk jumlah buku pada antaramuka (UI)
      const countEl = document.getElementById('totalBooksCount');
      if (countEl) {
        countEl.innerText = `Menunjukkan ${books.length} buah buku`;
      }

      if (books.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.classList.remove('hidden');

      books.forEach(book => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition hover:-translate-y-0.5";
        card.onclick = () => openModal(book);

        let statusColor = 'bg-green-100 text-green-700';
        let statusLabel = 'Tersedia';
        if (book.status === 'Borrowed') {
          statusColor = 'bg-amber-100 text-amber-700';
          statusLabel = 'Dipinjam';
        } else if (book.status === 'Pending') {
          statusColor = 'bg-blue-100 text-blue-700';
          statusLabel = 'Menunggu Kelulusan';
        }

        const typeBadge = book.is_ebook ? '<span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-1.5 py-0.5 rounded">E-BOOK</span>' : '<span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-1.5 py-0.5 rounded">FIZIKAL</span>';
        const codeBadge = book.book_code ? `<span class="bg-blue-600/90 text-white text-[10px] font-mono font-bold px-2 py-0.5 rounded-full shadow-sm">${book.book_code}</span>` : '';

        card.innerHTML = `
          <div class="h-44 bg-slate-100 relative overflow-hidden flex items-center justify-center">
            ${book.cover_url ? `<img src="${book.cover_url}" loading="lazy" class="w-full h-full object-cover">` : `<div class="text-slate-400 text-xs">Tiada Gambar</div>`}
            <div class="absolute top-2 left-2">${codeBadge}</div>
            <div class="absolute top-2 right-2">${typeBadge}</div>
          </div>
          <div class="p-3 flex flex-col flex-1 justify-between">
            <div>
              <h3 class="font-bold text-slate-800 text-sm line-clamp-2 leading-tight">${book.title}</h3>
              <p class="text-xs text-slate-500 mt-1 truncate">${book.author || 'Penulis Tidak Dinyatakan'}</p>
            </div>
            <div class="mt-3 flex items-center justify-between text-xs">
              <span class="px-2 py-0.5 rounded-full font-medium text-[11px] ${statusColor}">${statusLabel}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(book) {
      selectedBook = book;
      exitEditMode();

      document.getElementById('modalCodeBadge').innerText = book.book_code || "TIADA KOD";
      document.getElementById('modalTitle').innerText = book.title;
      document.getElementById('modalAuthor').innerText = "Penulis: " + (book.author || "-");
      document.getElementById('modalCategory').innerText = book.category || "Umum";

      let statusText = 'Tersedia di Rak';
      let statusClass = 'text-green-600 font-semibold';
      if (book.status === 'Borrowed') {
        statusText = 'Sedang Dipinjam';
        statusClass = 'text-amber-600 font-semibold';
      } else if (book.status === 'Pending') {
        statusText = 'Menunggu Kelulusan Admin';
        statusClass = 'text-blue-600 font-semibold';
      }
      document.getElementById('modalStatus').innerText = statusText;
      document.getElementById('modalStatus').className = statusClass;
      document.getElementById('modalImg').src = book.cover_url || "https://placehold.co/400x600?text=Tiada+Gambar";

      const badge = document.getElementById('modalBadge');
      const driveBtn = document.getElementById('modalDriveBtn');
      const borrowBtn = document.getElementById('modalBorrowBtn');

      if (book.is_ebook) {
        badge.className = "text-xs px-2.5 py-1 rounded-full font-medium bg-purple-100 text-purple-700";
        badge.innerText = "E-Book Digital";
        if (book.ebook_drive_url) {
          driveBtn.href = book.ebook_drive_url;
          driveBtn.classList.remove('hidden');
          driveBtn.classList.add('flex');
        }
        borrowBtn.classList.add('hidden');
      } else {
        badge.className = "text-xs px-2.5 py-1 rounded-full font-medium bg-slate-100 text-slate-700";
        badge.innerText = "Buku Fizikal";
        driveBtn.classList.add('hidden');
        borrowBtn.classList.remove('hidden');

        if (book.status === 'Available') {
          borrowBtn.disabled = false;
          borrowBtn.innerText = "Mohon Pinjam Buku Ini";
          borrowBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-xl transition";
        } else if (book.status === 'Pending') {
          borrowBtn.disabled = true;
          borrowBtn.innerText = "Permohonan Sedang Diproses Admin";
          borrowBtn.className = "w-full bg-amber-100 text-amber-700 text-sm font-semibold py-2.5 rounded-xl cursor-not-allowed";
        } else {
          borrowBtn.disabled = true;
          borrowBtn.innerText = "Buku Sedang Dipinjam";
          borrowBtn.className = "w-full bg-slate-200 text-slate-500 text-sm font-semibold py-2.5 rounded-xl cursor-not-allowed";
        }
      }

      // Tunjuk butang Edit/Delete hanya jika pengguna adalah Admin
      const adminSection = document.getElementById('adminActionSection');
      if (currentUser.role === 'admin') {
        adminSection.classList.remove('hidden');
      } else {
        adminSection.classList.add('hidden');
      }

      document.getElementById('bookModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('bookModal').classList.add('hidden');
      selectedBook = null;
      exitEditMode();
    }

    // Hantar Permohonan Pinjaman
    async function handleRequestBorrow() {
      if (!selectedBook) return;
      if (!confirm(`Sahkan permohonan pinjaman bagi buku: "${selectedBook.title}"? Permohonan akan dihantar kepada admin untuk kelulusan.`)) return;

      try {
        const client = getSupabase();

        // 1. Cipta rekod pinjaman dalam jadual loans
        const { error: loanError } = await client.from('loans').insert([{
          book_id: selectedBook.id,
          user_id: currentUser.id,
          status: 'Pending'
        }]);
        if (loanError) throw loanError;

        // 2. Kemas kini status buku kepada 'Pending'
        await client.from('books').update({ status: 'Pending' }).eq('id', selectedBook.id);

        alert("Permohonan pinjaman berjaya dihantar! Sila tunggu admin meluluskan permohonan anda.");
        closeModal();
        loadCatalog();
      } catch (err) {
        alert("Ralat semasa memohon pinjaman: " + (err.message || err));
      }
    }

    // Paparan Buku Pinjaman Saya (Untuk User)
    async function toggleMyLoansView() {
      const grid = document.getElementById('booksGrid');
      const filterControls = document.getElementById('filterControls');
      const myLoansTitle = document.getElementById('myLoansSectionTitle');
      const btnText = document.getElementById('myLoansBtnText');

      if (!isShowingMyLoans) {
        isShowingMyLoans = true;
        btnText.innerText = "Katalog Utama";
        filterControls.classList.add('hidden');
        myLoansTitle.classList.remove('hidden');

        try {
          const client = getSupabase();
          // Ambil buku yang berstatus Approved yang dipinjam oleh user semasa
          const { data, error } = await client
            .from('loans')
            .select('books (*)')
            .eq('user_id', currentUser.id)
            .eq('status', 'Approved');

          if (error) throw error;
          const myBorrowedBooks = (data || []).map(d => d.books).filter(Boolean);
          renderBooks(myBorrowedBooks);
        } catch (e) {
          alert("Ralat memuatkan rekod pinjaman anda: " + e.message);
        }
      } else {
        isShowingMyLoans = false;
        btnText.innerText = "Buku Pinjaman Saya";
        filterControls.classList.remove('hidden');
        myLoansTitle.classList.add('hidden');
        renderBooks(allBooks);
      }
    }

    // Fungsi Admin (Edit & Delete)
    function enterEditMode() {
      if (currentUser.role !== 'admin') return;
      document.getElementById('viewMode').classList.add('hidden');
      document.getElementById('editMode').classList.remove('hidden');
      document.getElementById('editBookCode').value = selectedBook.book_code || '';
      document.getElementById('editBookTitle').value = selectedBook.title || '';
      document.getElementById('editBookAuthor').value = selectedBook.author || '';
      document.getElementById('editDriveUrl').value = selectedBook.ebook_drive_url || '';
    }

    function exitEditMode() {
      document.getElementById('editMode').classList.add('hidden');
      document.getElementById('viewMode').classList.remove('hidden');
    }

    async function handleDeleteBook() {
      if (currentUser.role !== 'admin') return;
      if (!confirm(`Adakah anda pasti mahu memadam buku "${selectedBook.title}" secara kekal?`)) return;
      try {
        const client = getSupabase();
        await client.from("books").delete().eq("id", selectedBook.id);
        alert("Buku berjaya dipadam!");
        closeModal();
        loadCatalog();
      } catch (err) {
        alert("Ralat: " + err.message);
      }
    }

    async function handleSaveEdit(e) {
      e.preventDefault();
      if (currentUser.role !== 'admin') return;

      const saveBtn = document.getElementById('saveEditBtn');
      const updatedCode = document.getElementById('editBookCode').value.trim();
      const updatedTitle = document.getElementById('editBookTitle').value.trim();
      const updatedAuthor = document.getElementById('editBookAuthor').value.trim();
      const updatedDrive = document.getElementById('editDriveUrl').value.trim();
      const newCoverFile = document.getElementById('editNewCover').files[0];

      try {
        saveBtn.disabled = true;
        saveBtn.innerText = "Menyimpan...";

        let newCoverUrl = selectedBook.cover_url;
        if (newCoverFile) {
          const client = getSupabase();
          const fileName = `cover_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.jpg`;
          await client.storage.from("book-covers").upload(fileName, newCoverFile, { contentType: "image/jpeg" });
          const { data } = client.storage.from("book-covers").getPublicUrl(fileName);
          newCoverUrl = data.publicUrl;
        }

        const client = getSupabase();
        await client.from("books").update({
          book_code: updatedCode,
          title: updatedTitle,
          author: updatedAuthor || null,
          ebook_drive_url: updatedDrive || null,
          is_ebook: !!updatedDrive,
          cover_url: newCoverUrl
        }).eq("id", selectedBook.id);

        alert("Butiran buku berjaya dikemaskini!");
        closeModal();
        loadCatalog();
      } catch (err) {
        alert("Ralat: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Simpan Perubahan";
      }
    }

    // Filter & Carian
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterType').addEventListener('change', applyFilters);

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const type = document.getElementById('filterType').value;
      const categoryFilter = document.getElementById('filterCategory') ? document.getElementById('filterCategory').value : 'all';

      const filtered = allBooks.filter(book => {
        const matchQuery = (book.title && book.title.toLowerCase().includes(query)) ||
                           (book.book_code && book.book_code.toLowerCase().includes(query)) ||
                           (book.author && book.author.toLowerCase().includes(query)) ||
                           (book.category && book.category.toLowerCase().includes(query));
        
        let matchType = true;
        if (type === 'physical') matchType = !book.is_ebook;
        if (type === 'ebook') matchType = book.is_ebook;

        let matchCategory = true;
        if (categoryFilter !== 'all') matchCategory = book.category === categoryFilter;

        return matchQuery && matchType && matchCategory;
      });

      renderBooks(filtered);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupRoleUI();
      setTimeout(loadCatalog, 300);
    });
  </script>
</body>
</html>
